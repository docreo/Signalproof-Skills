version: 0.4
status: RD1_CANDIDATE
purpose: >-
  Compact routing metadata for the Signalproof Library. This registry helps the
  Router select minimal context. It is not execution authority and does not
  activate Candidate capabilities.

routing_defaults:
  principal_skill_max: 1
  optional_specialists_max: 2
  lazy_load: true
  root_contract_inherited: true
  governor_required_for_side_effects: true

capabilities:
  - {id: signalproof, state: ACTIVE, kind: root, purpose: universal human-authority and evidence contract, triggers: [fallback, governance]}
  - {id: signalproof-router, state: ACTIVE, kind: routing_kernel, purpose: select minimum justified capability set, triggers: [route, select skill, coordinate]}
  - {id: signalproof-known-errors, state: ACTIVE, kind: skill, purpose: prevent known repeatable failures, triggers: [known error, repeat failure, retry preflight]}
  - {id: signalproof-research, state: ACTIVE, kind: skill, purpose: establish external evidence, triggers: [research, sources, current evidence], loops: [SP-LOOP-RESEARCH]}
  - {id: signalproof-evaluate, state: ACTIVE, kind: skill, purpose: convert evidence into bounded disposition, triggers: [evaluate, adopt, adapt, integrate, reject, watch]}
  - {id: signalproof-investigate, state: ACTIVE, kind: skill, purpose: establish unknown state or cause, triggers: [investigate, diagnose state, root cause]}
  - {id: signalproof-plan, state: ACTIVE, kind: skill, purpose: define bounded execution contract, triggers: [plan, scope, acceptance, sequence]}
  - {id: signalproof-grill, state: ACTIVE, kind: skill, purpose: harden decisions and expose unresolved assumptions before action, triggers: [grill, stress-test decision, challenge plan, ambiguity hardening]}
  - {id: signalproof-grill-with-docs, state: ACTIVE, kind: composition_skill, purpose: harden decisions while capturing resolved terminology and durable ADR-worthy tradeoffs, triggers: [grill with docs, glossary while planning, adr while designing], specialists: [signalproof-grill, signalproof-document]}
  - {id: signalproof-teach, state: ACTIVE, kind: skill, purpose: mission-grounded source-backed durable teaching and skill development, triggers: [teach, learn topic, training, hamm advancement]}
  - {id: signalproof-cut-chase, state: ACTIVE, kind: skill, purpose: compress established material into decision-ready salient truth and action, triggers: [cut chase, cut to the chase, bottom line, what matters, action note, simplify report, no bs summary]}

  - id: signalproof-design
    state: ACTIVE
    kind: coordinator_skill
    purpose: product information architecture and state communication
    triggers: [product design, information architecture, dashboard, workflow hierarchy]
    specialists: [signalproof-ui-polish, signalproof-accessibility]
  - {id: signalproof-ui-polish, state: ACTIVE, kind: specialist_skill, purpose: interface wrapping/readability/responsive and micro-interaction finish, triggers: [clipping, overlap, wrapping, spacing, alignment, responsive, polish]}
  - {id: signalproof-accessibility, state: ACTIVE, kind: specialist_skill, purpose: accessible interaction and presentation, triggers: [keyboard, focus, screen reader, contrast, scaling, captions, reduced motion]}

  - {id: signalproof-readiness, state: ACTIVE, kind: skill, purpose: verify exact target prerequisites and capability readiness, triggers: [readiness, prerequisites, target environment]}
  - {id: signalproof-build, state: ACTIVE, kind: skill, purpose: bounded implementation under protected-state controls, triggers: [build, implement, modify, create software], loops: [SP-LOOP-BUILD-VERIFY]}
  - {id: signalproof-debug, state: ACTIVE, kind: skill, purpose: reproduce/localize/correct/regression-test defects, triggers: [bug, defect, failing behavior, regression], loops: [SP-LOOP-DEBUG, SP-LOOP-RETRY]}
  - id: signalproof-full-debug
    state: ACTIVE
    kind: coordinator_skill
    purpose: coordinate high-governance bounded debugging with failure-memory continuity, bounded authorization, role separation, and verification
    triggers: [full debug, full-debug, repeated debug failure, cross-layer defect, high-consequence defect]
    specialists: [signalproof-debug, signalproof-known-errors, signalproof-verify]
    loops: [SP-LOOP-DEBUG, SP-LOOP-RETRY, SP-LOOP-POWERSHELL-GUARD]
  - {id: signalproof-verify, state: ACTIVE, kind: skill, purpose: prove a specific material claim, triggers: [verify, prove, acceptance evidence]}
  - {id: signalproof-review, state: ACTIVE, kind: skill, purpose: review scope fidelity and change integrity, triggers: [review, audit change, contract fidelity]}

  - id: signalproof-recovery
    state: ACTIVE
    kind: coordinator_skill
    purpose: coordinate rollback, restore, cleanup and continuity
    triggers: [recovery, recover, multi-part rollback]
    specialists: [signalproof-rollback, signalproof-restore, signalproof-cleanup, signalproof-recovery-continuity]
    loops: [SP-LOOP-RECOVERY]
  - {id: signalproof-rollback, state: ACTIVE, kind: specialist_skill, purpose: select and verify known-good rollback target, triggers: [rollback target, previous baseline, backup verification]}
  - {id: signalproof-restore, state: ACTIVE, kind: specialist_skill, purpose: execute bounded restoration and verify it, triggers: [restore, replace with rollback, recover install]}
  - {id: signalproof-cleanup, state: ACTIVE, kind: specialist_skill, purpose: clean up owned partial-operation resources, triggers: [cleanup, orphan process, partial install, partial resource]}
  - {id: signalproof-recovery-continuity, state: ACTIVE, kind: specialist_skill, purpose: preserve recovery journals/ownership/remaining options, triggers: [recovery journal, unresolved ownership, recovery handoff]}

  - id: signalproof-security
    state: ACTIVE
    kind: coordinator_skill
    purpose: coordinate cross-cutting defensive security review
    triggers: [security, trust boundary, security review]
    specialists: [signalproof-secrets, signalproof-permissions, signalproof-supply-chain, signalproof-network, signalproof-execution-security]
  - {id: signalproof-secrets, state: ACTIVE, kind: specialist_skill, purpose: credentials/tokens/keys/exposure/redaction, triggers: [secret, token, api key, credential, password, redaction]}
  - {id: signalproof-permissions, state: ACTIVE, kind: specialist_skill, purpose: identity/authorization/privilege/least privilege, triggers: [permission, privilege, admin, acl, oauth scope, authorization]}
  - {id: signalproof-supply-chain, state: ACTIVE, kind: specialist_skill, purpose: dependency source/license/integrity/update trust, triggers: [dependency, package, publisher, license, checksum, signature, updater]}
  - {id: signalproof-network, state: ACTIVE, kind: specialist_skill, purpose: network exposure/transport/external data flow, triggers: [port, endpoint, telemetry, outbound, inbound, tls, network]}
  - {id: signalproof-execution-security, state: ACTIVE, kind: specialist_skill, purpose: untrusted input and code/tool execution boundaries, triggers: [prompt injection, shell injection, plugin, dynamic execution, archive extraction, untrusted script]}

  - {id: signalproof-release, state: ACTIVE, kind: skill, purpose: exact-artifact promotion and distribution governance, triggers: [release, ship, publish artifact, deploy candidate]}
  - {id: signalproof-document, state: ACTIVE, kind: skill, purpose: durable evidence-bound documentation, triggers: [document, runbook, adr, report, readme]}
  - {id: signalproof-learn, state: ACTIVE, kind: skill, purpose: extract governed reusable lessons/candidates, triggers: [learn, reusable lesson, regression candidate], loops: [SP-LOOP-LEARN]}
  - {id: signalproof-handoff, state: ACTIVE, kind: skill, purpose: preserve open work across conversation/session boundary, triggers: [handoff, fresh chat, transfer context]}
  - {id: signalproof-closeout, state: ACTIVE, kind: skill, purpose: close meaningful milestone and preserve transition evidence, triggers: [closeout, milestone complete, phase transition]}

candidates:
  - id: signalproof-failure-intelligence
    state: CANDIDATE
    kind: skill
    purpose: structured cross-project recurrence matching and mitigation memory
    path: skills/candidates/signalproof-failure-intelligence/SKILL.md
    loops: [SP-LOOP-RETRY]
  - id: signalproof-knowledge
    state: CANDIDATE
    kind: coordinator_skill
    purpose: governed source-to-knowledge transformation coordination
    path: skills/candidates/signalproof-knowledge/SKILL.md
    specialists:
      - signalproof-knowledge-ingest
      - signalproof-knowledge-provenance
      - signalproof-knowledge-transform
      - signalproof-knowledge-package
