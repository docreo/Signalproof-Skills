version: 0.1
status: RESEARCH_QUEUE
purpose: >-
  External projects and sources worth Signalproof examination. Entries here are
  discovery targets only. Listing does not grant trust, integration, execution,
  endorsement, promotion, or authority.

rules:
  - research_before_evaluation
  - verify_current_upstream_state
  - treat_directory_or_catalog_entries_as_discovery_evidence_only
  - evaluate_each_runtime_dependency_or_api_individually
  - preserve_license_tos_privacy_security_provenance_and_availability_gates
  - do_not_promote_from_watchlist_without_governed_evidence

entries:
  - id: public-apis-public-apis
    source: https://github.com/public-apis/public-apis
    kind: api_discovery_corpus
    state: WATCHLIST
    disposition: RESEARCH_MORE
    initial_fit: >-
      Potential discovery feed for finding external APIs relevant to Signalproof
      products, research, automation, opportunity analysis, and capability design.
    initial_evidence:
      license: MIT
      upstream_description: A collective list of free APIs
      activity: active_community_project
      caveat: >-
        The directory contains community-curated links and has recurring stale or
        dead endpoint reports plus a large contribution backlog. Presence in the
        list is not evidence that an API is live, safe, lawful, suitable, or
        approved for Signalproof use.
    required_examination:
      - corpus_structure_and_machine_readability
      - update_and_link_validation_process
      - stale_or_hijacked_endpoint_risk
      - provenance_and_maintainer_controls
      - usefulness_as_api_discovery_feed
      - per_api_auth_privacy_security_license_tos_and_availability_gates
      - whether_to_adopt_catalog_data_adapt_patterns_or_build_our_own_curated_index
    authority: discovery_only
