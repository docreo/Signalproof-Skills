name: Signalproof Suite Consistency

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  suite-consistency:
    name: suite-consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Show Python version
        run: python3 --version

      - name: Run fixture regression tests
        run: python3 -m unittest discover -s tests/consistency -p 'test_*.py' -v

      - name: Check live suite consistency
        run: python3 tools/check_suite_consistency.py

      - name: Enforce Signalproof Skill Atomicity budget
        run: python3 tools/check_skill_budget.py

      - name: Check Signalproof Library registries and loops
        run: python3 tools/check_library_consistency.py
