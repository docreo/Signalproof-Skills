name: Signalproof Suite Consistency

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  suite-consistency:
    name: suite-consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Python version
        run: python3 --version

      - name: Run fixture regression tests
        run: python3 -m unittest discover -s tests/consistency -p 'test_*.py' -v

      - name: Check live suite consistency
        run: python3 tools/check_suite_consistency.py

      - name: Check Signalproof Library registries and loops
        run: python3 tools/check_library_consistency.py

  skill-budget:
    name: skill-budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Python version
        run: python3 --version

      - name: Enforce Signalproof Skill Atomicity budget
        run: python3 tools/check_skill_budget.py

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Python version
        run: python3 --version

      - name: Run deterministic public-boundary regression tests
        run: python3 -m unittest discover -s tests/security -p 'test_*.py' -v

      - name: Check tracked public boundary and high-confidence credential patterns
        run: python3 tools/check_public_boundary.py
